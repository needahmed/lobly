services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lobly
      POSTGRES_PASSWORD: lobly
      POSTGRES_DB: lobly
    ports:
      - "5433:5432" # host 5433: a native PostgreSQL service may already own 5432 on this machine
    volumes:
      - lobly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobly -d lobly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lobly_pg:
